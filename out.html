<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todos App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-800">
    <div class="min-h-screen flex items-center justify-center p-6">
      <div class="w-full max-w-2xl">
        <div class="mb-6 text-center">
          <h1 class="text-3xl font-bold">Todos</h1>
          <p id="status" class="text-sm text-slate-500 mt-1">Cargando...</p>
        </div>

        <div class="bg-white shadow-sm rounded-xl border border-slate-200 p-5">
          <form id="form" class="flex gap-3 items-center">
            <input
              id="title"
              type="text"
              placeholder="Nueva tarea"
              class="flex-1 rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
            <button
              type="submit"
              class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 text-white px-4 py-2 font-medium hover:bg-indigo-700 active:bg-indigo-800 transition"
            >
              Agregar
            </button>
          </form>

          <ul id="list" class="mt-5 divide-y divide-slate-200"></ul>
        </div>
      </div>
    </div>

    <template id="itemTpl">
      <li class="py-3 flex items-start justify-between">
        <div class="flex items-start gap-3">
          <div class="mt-1">
            <span class="inline-flex h-2.5 w-2.5 rounded-full bg-slate-300" data-done-indicator></span>
          </div>
          <div>
            <p class="font-medium text-slate-800" data-title></p>
            <p class="text-xs text-slate-400" data-meta></p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button class="px-3 py-1 rounded-md border text-xs hover:bg-slate-50" data-action="toggle">Marcar</button>
          <button class="px-3 py-1 rounded-md border text-xs text-red-600 hover:bg-red-50" data-action="delete">Eliminar</button>
        </div>
      </li>
    </template>

    <script>
      const $status = document.getElementById('status');
      const $list = document.getElementById('list');
      const $tpl = document.getElementById('itemTpl');

      function render(items) {
        $list.innerHTML = '';
        if (!items.length) {
          $list.innerHTML = '<li class="py-6 text-center text-slate-400">Sin tareas por ahora</li>';
          return;
        }
        for (const t of items) {
          const node = $tpl.content.cloneNode(true);
          node.querySelector('[data-title]').textContent = t.title;
          node.querySelector('[data-meta]').textContent = `#${t.id} · ${t.done ? 'completado' : 'pendiente'}`;
          const ind = node.querySelector('[data-done-indicator]');
          ind.classList.remove('bg-slate-300');
          ind.classList.add(t.done ? 'bg-emerald-500' : 'bg-amber-400');
          node.firstElementChild.setAttribute('data-id', t.id);
          node.firstElementChild.setAttribute('data-done', t.done ? 'true' : 'false');
          $list.appendChild(node);
        }
      }

      async function fetchTodos() {
        try {
          const res = await fetch('/api/todos');
          const data = await res.json();
          render(data);
          $status.textContent = 'Listo';
        } catch (e) {
          $status.textContent = 'Error cargando';
        }
      }

      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('title');
        const title = input.value.trim();
        if (!title) return;
        try {
          await fetch('/api/todos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title })
          });
          input.value = '';
          fetchTodos();
        } catch (e) {
          $status.textContent = 'Error al guardar';
        }
      });

      // Event delegation for toggle/delete
      $list.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const li = btn.closest('li');
        const id = li.getAttribute('data-id');
        const action = btn.getAttribute('data-action');
        try {
          if (action === 'toggle') {
            const current = li.getAttribute('data-done') === 'true';
            await fetch(`/api/todos/${id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ done: !current })
            });
          } else if (action === 'delete') {
            await fetch(`/api/todos/${id}`, { method: 'DELETE' });
          }
          fetchTodos();
        } catch (err) {
          $status.textContent = 'Acción fallida';
        }
      });

      fetchTodos();
    </script>
  </body>
  </html>
