<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todos App</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      h1 { margin-bottom: 0.5rem; }
      form { margin: 1rem 0; }
      input[type=text] { padding: 0.5rem; width: 300px; }
      button { padding: 0.5rem 1rem; }
      li { margin-bottom: 0.25rem; }
      .status { color: #666; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>Todos</h1>
    <div class="status" id="status">Cargando...</div>
    <form id="form">
      <input id="title" type="text" placeholder="Nueva tarea" />
      <button type="submit">Agregar</button>
    </form>
    <ul id="list"></ul>

    <script>
      async function fetchTodos() {
        try {
          const res = await fetch('/api/todos');
          const data = await res.json();
          const list = document.getElementById('list');
          list.innerHTML = '';
          data.forEach(t => {
            const li = document.createElement('li');
            li.textContent = `#${t.id} - ${t.title} [${t.done ? 'X' : ' '}]`;
            list.appendChild(li);
          });
          document.getElementById('status').textContent = 'Listo';
        } catch (e) {
          document.getElementById('status').textContent = 'Error cargando';
        }
      }

      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value.trim();
        if (!title) return;
        await fetch('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        document.getElementById('title').value = '';
        fetchTodos();
      });

      fetchTodos();
    </script>
  </body>
  </html>
